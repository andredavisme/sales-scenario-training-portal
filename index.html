<style>
:root {

  --font-body: 'DM Sans', sans-serif;

  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
  --space-12: 3rem; --space-16: 4rem; --space-20: 5rem;
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
  --radius-xl: 1rem; --radius-2xl: 1.5rem; --radius-full: 9999px;
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --content-default: 860px;
}
:root, [data-theme="light"] {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #f9f8f5;
  --border: rgba(30,20,5,0.1);
  --text: #1a1508;
  --text-muted: #6b6254;
  --text-faint: #b0a898;
  --accent: #e05c1a;
  --accent-hover: #c44a10;
  --accent-highlight: rgba(224,92,26,0.1);

  --accent-2-hover: #155a4a;
  --accent-2-highlight: rgba(26,110,92,0.1);
  --correct: #1a6e5c;
  --correct-bg: #e8f5f1;
  --incorrect: #c0392b;

  --shadow-sm: 0 1px 3px rgba(20,10,0,0.07), 0 1px 2px rgba(20,10,0,0.04);
  --shadow-md: 0 4px 16px rgba(20,10,0,0.09), 0 1px 3px rgba(20,10,0,0.05);
  --shadow-lg: 0 12px 40px rgba(20,10,0,0.12), 0 4px 8px rgba(20,10,0,0.06);
}
[data-theme="dark"] {
  --bg: #141210;
  --surface: #1e1b18;
  --surface-2: #252220;
  --border: rgba(255,240,220,0.1);
  --text: #f0ece4;
  --text-muted: #8a8070;
  --text-faint: #5a5248;
  --accent: #f07840;
  --accent-hover: #f59060;
  --accent-highlight: rgba(240,120,64,0.15);
  --accent-2: #3daa8c;
  --accent-2-hover: #55c4a2;
  --accent-2-highlight: rgba(61,170,140,0.15);

  --text-faint: #5a5248; --accent: #f07840; --accent-hover: #f59060;
  --accent-highlight: rgba(240,120,64,0.15); --accent-2: #3daa8c;

  --incorrect: #e05858; --incorrect-bg: rgba(224,88,88,0.12);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.4);

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--text);
  background: var(--bg);
  min-height: 100dvh;
  line-height: 1.6;
  transition: background var(--transition), color var(--transition);
}
img { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.header {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in oklch, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: var(--space-3) var(--space-6);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-4);
}
.logo {
  display: flex; align-items: center; gap: var(--space-3);
  font-family: var(--font-display); font-size: var(--text-lg);
  font-weight: 700; letter-spacing: -0.02em;
}
.logo-mark { width: 36px; height: 36px; flex-shrink: 0; }
.logo-sub { font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-body); font-weight: 400; letter-spacing: 0; display: block; }
.header-right { display: flex; align-items: center; gap: var(--space-3); }
.theme-btn {
  width: 36px; height: 36px; border-radius: var(--radius-full);
  display: grid; place-items: center; color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
}
.theme-btn:hover { background: var(--accent-highlight); color: var(--accent); }
.session-badge {
  font-size: var(--text-xs); font-weight: 600;
  background: var(--accent-highlight); color: var(--accent);
  border-radius: var(--radius-full); padding: var(--space-1) var(--space-3);
  display: none;
}
.session-badge.visible { display: block; }
.view { display: none; animation: fadeUp 0.3s ease; }
.view.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.home-hero {
  max-width: var(--content-default);
  margin: 0 auto;
  padding: var(--space-16) var(--space-6) var(--space-10);
}
.eyebrow {
  font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: var(--space-4);
}
.hero-headline {
  font-family: var(--font-display);
  font-size: var(--text-2xl); font-weight: 800;
  line-height: 1.1; letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: var(--space-5);
}
.hero-headline em { font-style: italic; color: var(--accent); }
.hero-sub {
  font-size: var(--text-lg); color: var(--text-muted);
  max-width: 52ch; margin-bottom: var(--space-10); line-height: 1.5;
}
.module-grid {
  max-width: var(--content-default);
  margin: 0 auto;
  padding: 0 var(--space-6) var(--space-20);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
  gap: var(--space-4);
}
.module-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-2xl);
  padding: var(--space-6);
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.module-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--card-accent, var(--accent));
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--transition);
}
.module-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: transparent; }
.module-card:hover::before { transform: scaleX(1); }
.card-icon { font-size: 2rem; margin-bottom: var(--space-4); line-height: 1; }
.card-title {
  font-family: var(--font-display); font-size: var(--text-lg);
  font-weight: 700; letter-spacing: -0.02em; margin-bottom: var(--space-2);
}
.card-desc { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.5; margin-bottom: var(--space-5); }
.card-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-2);
}
.card-count { font-size: var(--text-xs); font-weight: 600; color: var(--text-faint); letter-spacing: 0.04em; }
.card-arrow {
  width: 28px; height: 28px; border-radius: var(--radius-full);
  background: var(--accent-highlight);
  display: grid; place-items: center;
  color: var(--accent); flex-shrink: 0;
  transition: background var(--transition), transform var(--transition);
}
.module-card:hover .card-arrow { background: var(--accent); color: white; transform: translateX(2px); }
.quiz-wrap {
  max-width: var(--content-default);
  margin: 0 auto;
  padding: var(--space-8) var(--space-6) var(--space-20);
}
.quiz-header {
  display: flex; align-items: center; gap: var(--space-4);
  margin-bottom: var(--space-8);
}
.back-btn {
  display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-sm); font-weight: 500; color: var(--text-muted);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  transition: color var(--transition), background var(--transition);
}
.back-btn:hover { color: var(--text); background: var(--accent-highlight); }
.quiz-title-block { flex: 1; }
.quiz-module-label {
  font-size: var(--text-xs); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--accent); margin-bottom: var(--space-1);
}
.quiz-title {
  font-family: var(--font-display); font-size: var(--text-xl);
  font-weight: 800; letter-spacing: -0.02em;
}
.progress-bar-wrap {
  background: var(--border);
  border-radius: var(--radius-full);
  height: 6px; margin-bottom: var(--space-8); overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: var(--radius-full);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.question-counter {
  font-size: var(--text-xs); color: var(--text-faint);
  font-weight: 600; letter-spacing: 0.06em;
  margin-bottom: var(--space-4);
}
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-2xl);
  padding: var(--space-8);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-5);
}
.difficulty-tag {
  display: inline-block;
  font-size: var(--text-xs); font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  border-radius: var(--radius-full);
  padding: 2px var(--space-3);
  margin-bottom: var(--space-5);
}
.difficulty-tag.easy { background: var(--accent-2-highlight); color: var(--accent-2); }
.difficulty-tag.medium { background: rgba(180,120,0,0.1); color: #8a6500; }
.difficulty-tag.hard { background: rgba(180,30,30,0.1); color: #b02020; }
[data-theme="dark"] .difficulty-tag.medium { color: #d4a020; }
[data-theme="dark"] .difficulty-tag.hard { color: #e06060; }
.question-prompt {
  font-size: var(--text-lg); line-height: 1.55;
  font-weight: 500; color: var(--text);
  margin-bottom: var(--space-8);
}
.choices { display: flex; flex-direction: column; gap: var(--space-3); }
.choice-btn {
  display: flex; align-items: flex-start; gap: var(--space-4);
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-xl);
  padding: var(--space-4) var(--space-5);
  text-align: left;
  transition: border-color var(--transition), background var(--transition), transform var(--transition);
  cursor: pointer;
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-highlight);
  transform: translateX(3px);
}
.choice-btn:disabled { cursor: default; }
.choice-label {
  width: 28px; height: 28px; flex-shrink: 0;
  border-radius: var(--radius-full);
  background: var(--border);
  display: grid; place-items: center;
  font-size: var(--text-sm); font-weight: 700;
  color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
}
.choice-text { font-size: var(--text-base); line-height: 1.5; padding-top: 2px; }
.choice-btn.correct { background: var(--correct-bg); border-color: var(--correct); transform: none; }
.choice-btn.correct .choice-label { background: var(--correct); color: white; }
.choice-btn.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect); transform: none; }
.choice-btn.incorrect .choice-label { background: var(--incorrect); color: white; }
.choice-btn.dim { opacity: 0.4; transform: none; }
.explanation-card {
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  margin-top: var(--space-5);
  border: 1px solid;
  display: none;
  animation: fadeUp 0.25s ease;
}
.explanation-card.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
.explanation-card.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect); color: var(--incorrect); }
.explanation-card.show { display: block; }
.explanation-label { font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: var(--space-2); }
.explanation-text { font-size: var(--text-sm); line-height: 1.65; color: var(--text); }
.quiz-actions {
  display: flex; justify-content: flex-end;
  margin-top: var(--space-6);
}
.btn-primary {
  background: var(--accent); color: white;
  font-family: var(--font-body); font-size: var(--text-sm); font-weight: 700;
  padding: var(--space-3) var(--space-8);
  border-radius: var(--radius-full);
  transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 2px 8px rgba(224,92,26,0.3);
  letter-spacing: 0.02em;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(224,92,26,0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.4; pointer-events: none; }
.results-wrap {
  max-width: 600px; margin: 0 auto;
  padding: var(--space-12) var(--space-6) var(--space-20);
  text-align: center;
}
.score-ring-wrap { display: flex; justify-content: center; margin-bottom: var(--space-8); }
.score-ring { position: relative; width: 160px; height: 160px; }
.score-ring svg { transform: rotate(-90deg); }
.score-ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
.score-ring-fill {
  fill: none; stroke-width: 10; stroke-linecap: round;
  stroke: var(--accent);
  transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1);
}
.score-ring-text {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.score-number {
  font-family: var(--font-display); font-size: 2.5rem;
  font-weight: 800; line-height: 1; color: var(--text);
}
.score-denom { font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; }
.results-headline {
  font-family: var(--font-display); font-size: var(--text-xl);
  font-weight: 800; letter-spacing: -0.02em;
  margin-bottom: var(--space-3);
}
.results-sub { font-size: var(--text-base); color: var(--text-muted); margin-bottom: var(--space-10); }
.results-actions { display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; }
.btn-secondary {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--font-body);
  font-size: var(--text-sm); font-weight: 600;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-full);
  transition: border-color var(--transition), background var(--transition);
}
.btn-secondary:hover { border-color: var(--accent); background: var(--accent-highlight); }
.loading-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: var(--space-4);
  padding: var(--space-20);
  color: var(--text-muted); font-size: var(--text-sm);
}
.spinner {
  width: 36px; height: 36px; border-radius: var(--radius-full);
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 600px) {
  .hero-headline { font-size: clamp(1.8rem, 8vw, 2.5rem); }
  .module-grid { padding-inline: var(--space-4); gap: var(--space-3); }
  .quiz-wrap { padding-inline: var(--space-4); }
  .question-card { padding: var(--space-5); }
  .quiz-header { flex-wrap: wrap; }
  .results-wrap { padding-inline: var(--space-4); }
}
</style>
</head>

  { key: 'power_supplies', label: 'Power Supplies',            icon: '💡', desc: 'DC power supply selection, sizing, and troubleshooting scenarios.', color: '#7c3aed' },
  { key: 'starters',       label: 'Motor Starters',            icon: '🔁', desc: 'FVNR, FVR, soft starters, overload sizing, and NEC requirements.', color: '#0369a1' },
  { key: 'controls',       label: 'Industrial Controls',       icon: '🎛️', desc: 'Control circuits, pilot devices, E-stops, and troubleshooting.', color: '#b45309' },
];
let state = { currentModule: null, scenarios: [], index: 0, score: 0, answered: false };
async function fetchScenarios(module) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/scenarios?module=eq.${module}&select=*&order=random()`,
    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) throw new Error('fetch failed');
  return res.json();
}
async function fetchCounts() {
  const counts = {};
  await Promise.all(MODULES.map(async m => {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/scenarios?module=eq.${m.key}&select=id`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'count=exact', Range: '0-0' } });
    const range = res.headers.get('content-range');
    counts[m.key] = range ? parseInt(range.split('/')[1]) || 0 : 0;
  }));
  return counts;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
async function initHome() {
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Loading modules…</span></div>';
  try {
    const counts = await fetchCounts();
    grid.innerHTML = '';
    MODULES.forEach(m => {
      const card = document.createElement('div');
      card.className = 'module-card';
      card.style.setProperty('--card-accent', m.color);
      card.innerHTML = `<div class="card-icon">${m.icon}</div><div class="card-title">${m.label}</div><div class="card-desc">${m.desc}</div><div class="card-meta"><span class="card-count">${counts[m.key] ?? 0} SCENARIOS</span><span class="card-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span></div>`;
      card.addEventListener('click', () => startModule(m));
      grid.appendChild(card);
    });
  } catch(e) {
    grid.innerHTML = '<div class="loading-state" style="color:var(--incorrect)">⚠️ Could not load modules.</div>';
  }
}
async function startModule(module) {
  state = { currentModule: module, scenarios: [], index: 0, score: 0, answered: false };
  document.getElementById('quizModuleLabel').textContent = module.icon + ' ' + module.label;
  document.getElementById('quizTitle').textContent = 'Practice Mode';
  document.getElementById('quizContent').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Loading scenarios…</span></div>';
  showView('view-quiz');
  try {
    const all = await fetchScenarios(module.key);
    state.scenarios = shuffle(all);
    renderQuestion();
  } catch(e) {
    document.getElementById('quizContent').innerHTML = '<div class="loading-state" style="color:var(--incorrect)">⚠️ Could not load scenarios.</div>';
  }
}
function updateProgress() {
  const total = state.scenarios.length;
  document.getElementById('progressFill').style.width = (total ? (state.index / total) * 100 : 0) + '%';
  const badge = document.getElementById('sessionBadge');
  badge.textContent = `${state.index}/${total}`;
  badge.classList.add('visible');
}
function renderQuestion() {
  const s = state.scenarios[state.index];
  const total = state.scenarios.length;
  state.answered = false;
  updateProgress();
  const diff = s.difficulty || 'medium';
  const diffLabel = diff.charAt(0).toUpperCase() + diff.slice(1);
  let choicesHtml = '';
  s.choices.forEach(c => { choicesHtml += `<button class="choice-btn" data-label="${c.label}"><span class="choice-label">${c.label}</span><span class="choice-text">${c.text}</span></button>`; });
  document.getElementById('quizContent').innerHTML = `<div class="question-counter">Question ${state.index + 1} of ${total}</div><div class="question-card"><span class="difficulty-tag ${diff}">${diffLabel}</span><p class="question-prompt">${s.prompt}</p><div class="choices">${choicesHtml}</div><div class="explanation-card" id="explanationCard"><div class="explanation-label" id="explanationLabel"></div><div class="explanation-text">${s.explanation}</div></div></div><div class="quiz-actions"><button class="btn-primary" id="nextBtn" disabled>${state.index + 1 < total ? 'Next Question \u2192' : 'See Results \u2192'}</button></div>`;
  document.querySelectorAll('.choice-btn').forEach(btn => btn.addEventListener('click', () => handleAnswer(btn, s)));
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}
function handleAnswer(btn, scenario) {
  if (state.answered) return;
  state.answered = true;
  const chosen = btn.dataset.label;
  const correct = scenario.answer;
  const isCorrect = chosen === correct;
  if (isCorrect) state.score++;
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.label === correct) b.classList.add('correct');
    else if (b === btn && !isCorrect) b.classList.add('incorrect');
    else if (b.dataset.label !== correct) b.classList.add('dim');
  });
  const card = document.getElementById('explanationCard');
  card.className = `explanation-card ${isCorrect ? 'correct' : 'incorrect'} show`;
  document.getElementById('explanationLabel').textContent = isCorrect ? '\u2713 Correct!' : `\u2717 Correct answer: ${correct}`;
  document.getElementById('nextBtn').disabled = false;
}
function nextQuestion() {
  state.index++;
  state.index >= state.scenarios.length ? showResults() : renderQuestion();
}
function showResults() {
  const score = state.score, total = state.scenarios.length, pct = total ? score / total : 0;
  document.getElementById('sessionBadge').classList.remove('visible');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('scoreNumber').textContent = score;
  document.getElementById('scoreDenom').textContent = `/ ${total}`;
  const headlines = [[0.9,'Outstanding! \ud83c\udfaf','You really know your stuff. Customers can count on you.'],[0.7,'Strong work! \ud83d�','Solid knowledge. Review missed questions to sharpen your edge.'],[0.5,'Good start! \ud83d�','You\'re building momentum. Run through it again to lock in the details.'],[0,'Keep going! \ud83d�','Every rep takes practice. Try again \u2014 you\'ll see the improvement.']];
  const [, headline, sub] = headlines.find(([min]) => pct >= min);
  document.getElementById('resultsHeadline').textContent = headline;
  document.getElementById('resultsSub').textContent = sub;
  showView('view-results');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('scoreRingFill').style.strokeDashoffset = 439.8 * (1 - pct);
    let cur = 0; const start = performance.now();
    function tick(now) { const t = Math.min((now - start) / 800, 1); document.getElementById('scoreNumber').textContent = Math.round(t * score); if (t < 1) requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  }));
  document.getElementById('retryBtn').onclick = () => startModule(state.currentModule);
  document.getElementById('allModulesBtn').onclick = goHome;
}
function goHome() {
  document.getElementById('sessionBadge').classList.remove('visible');
  document.getElementById('progressFill').style.width = '0%';
  showView('view-home');
}
document.getElementById('backBtn').addEventListener('click', goHome);
(function(){
  const btn = document.querySelector('[data-theme-toggle]'), html = document.documentElement;
  let theme = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  html.setAttribute('data-theme', theme);
  function setIcon(t) { btn.innerHTML = t === 'dark' ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'; }
  setIcon(theme);
  btn.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; html.setAttribute('data-theme', theme); setIcon(theme); });
})();
initHome();
<\/script>
</body>
